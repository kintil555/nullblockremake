modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"
issueTrackerURL = "https://github.com/kintil555/nullblockremake/issues"

[[mods]]
modId = "nullblock_remake"
version = "${mod_version}"
displayName = "Null Block Remake"
description = '''
A passthrough block that can visually disguise itself as any other block
while remaining fully non-solid. A stability-focused rewrite of the
original NullBlock mod, designed to be usable as a library dependency
by other mods (see NullBlockAPI).
'''
authors = "kintil555"

[[dependencies.nullblock_remake]]
    modId = "forge"
    mandatory = true
    versionRange = "[54.1.16,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.nullblock_remake]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.21.4,1.21.5)"
    ordering = "NONE"
    side = "BOTH"

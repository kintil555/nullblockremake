name: Build

on:
  push:
    branches: [ "main", "master", "fabric-port" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
          gradle-version: '8.11'

      - name: Regenerate Gradle Wrapper (jar missing from repo)
        run: gradle wrapper --gradle-version 8.11 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clear ForgeGradle caches
        run: rm -rf ~/.gradle/caches/forge_gradle ~/.gradle/caches/minecraft_user_repo ~/.gradle/caches/retro_futura_gradle ~/.gradle/caches/*/net/minecraftforge

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon --refresh-dependencies

      - name: Locate build artifact
        id: artifact
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/
          if-no-files-found: ignore

      - name: Create GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
          name: NullBlock Remake ${{ github.ref_name }}
          fail_on_unmatched_files: true

      - name: Publish rolling "latest" release (branch push)
        if: github.ref == 'refs/heads/fabric-port'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-fabric-port
          name: NullBlock Remake (fabric-port latest)
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
